[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mado-game-audio-loop"
version = "2.4.0"
description = "A reproducible local workbench for game sound-effect recipes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mgal = "mgal.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/mgal"]

[tool.hatch.build.targets.wheel.force-include]
"src/mgal/web" = "mgal/web"
